services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: civicos
      POSTGRES_PASSWORD: civicos
      POSTGRES_DB: civicos
    ports:
      - '5432:5432'
    volumes:
      - civicos-postgres:/var/lib/postgresql/data

  tileserver:
    image: maptiler/tileserver-gl:v5.6.0
    ports:
      - '8080:8080'
    volumes:
      - ./storage/tiles/cadn:/data:ro
    restart: unless-stopped

volumes:
  civicos-postgres:
